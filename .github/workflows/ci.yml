name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: velora-test-jwt-secret-value
          RAZORPAY_KEY_SECRET: test_razorpay_secret_key
          ALLOW_EMBEDDED_MONGO: 'true'
